# site properties and page defaults
title: TRELA
subtitle: Trusted and RELiable Architectures Lab
description: TRELA, led by Prof. Yiorgos Makris, builds trusted and reliable integrated circuits and systems by combining machine learning, statistical analysis, and hardware design, with work spanning hardware security, AI for test, analog/RF ICs, and bio-security primitives.
header: images/background.svg
# main lab logo shown in the header (the chip icon in images/logo.svg is kept for the browser tab icon)
logo: images/trela.logo.png
footer: images/background.svg
proofer: false

# site social media and other links (shown as icons in the footer and on the home page)
# TODO: fill in the lab's accounts and UCSD email, then uncomment
links:
  email: ymakris@ucsd.edu
  # instagram: your-instagram-handle
  # x: your-x-handle
  # linkedin: company/your-linkedin-page
  # github: your-github-org
  # huggingface: your-huggingface-org
  # google-scholar: your-scholar-id
  # youtube: "@your-channel"

### jekyll settings

# front matter defaults
defaults:
  # all markdown files
  - scope:
      path: ""
    values:
      layout: default
  # markdown files in /_members
  - scope:
      type: "members"
    values:
      layout: member
  # markdown files in /_posts
  - scope:
      type: "posts"
    values:
      layout: post

collections:
  # generate page for each member
  members:
    output: true
  # generate page for each post
  posts:
    output: true

# jekyll plugins
plugins:
  - jekyll-spaceship
  - jekyll-sitemap
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-last-modified-at

# code block syntax highlighting
highlighter: rouge

# jekyll theme
theme: null

# sass settings
sass:
  sass_dir: _styles

# force jekyll to include certain files/folders
include:
  - _styles
  - _scripts
  - .nojekyll

# force jekyll to exclude certain files/folders
exclude:
  - README.md
  - LICENSE.md
  - CITATION.cff
  - vendor

# configure jekyll spaceship
jekyll-spaceship:
  mathjax-processor:
    src:
      - https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js
